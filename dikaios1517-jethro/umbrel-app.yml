gallery: []
releaseNotes: >-
  2.39.0-1: packaging fix - the first release seeded conf.php behind a
  symlink and stored state outside the managed data folder, which could
  leave the app reporting "Jethro configuration file not found". conf.php
  now persists at data/conf.php (Files -> Apps -> Jethro PMM -> data) and
  is copied into the web root on every start; uploads and the MariaDB
  datadir moved under data/ as well. Existing installs: reinstall to reset.
  2.39.0: initial Umbrel packaging of Jethro PMM 2.39.0 (release archive
  with PHP dependencies included), backed by MariaDB with Jethro's required
  database settings applied automatically.
