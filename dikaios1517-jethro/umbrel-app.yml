releaseNotes: >-
  2.39.0-2: database connectivity fix - umbrelOS forces <app>_<service>_1
  container names, which breaks service-name DNS, so the bundled MariaDB is
  now reached by container name; existing conf.php files are migrated
  automatically on start. 2.39.0-1: packaging fix - conf.php now persists at
  data/conf.php (Files -> Apps -> Jethro PMM -> data) and is copied into the
  web root on every start; uploads and the MariaDB datadir moved under data/
  as well. 2.39.0: initial Umbrel packaging of Jethro PMM 2.39.0 (release
  archive with PHP dependencies included), backed by MariaDB with Jethro's
  required database settings applied automatically.
