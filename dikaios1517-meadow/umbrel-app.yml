releaseNotes: >-
  0.1.1: media linked in plain kind 1 notes is now included (Blossom-style
  URLs pasted in the note text, extracted from the content — the note
  itself is never shown), and the feed gained photo/video filters
  (Photos & video / Photos / Videos / Everything).
  0.1.0: first release — social-graph media browser: enter an npub, Meadow
  walks its follows and relay lists, harvests the graph's picture/video
  events and Blossom media-server declarations, queries servers that allow
  public listing, and serves a deduplicated, paginated photo/video feed
  with background profile enrichment.
