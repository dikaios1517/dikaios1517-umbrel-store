  tunnels); the management page moves to http://umbrel:3000 (dashboard icon and
  Tor unchanged). Adds optional retention: purge events older than a chosen
  number of months, keep the admin's notes indefinitely, run daily. Relay core
  remains upstream v0.9.3.
