manifestVersion: 1
id: dikaios1517-wisp
category: social
name: Wisp
version: "0.9.5"
tagline: A fast, lightweight private Nostr relay
icon: https://raw.githubusercontent.com/privkeyio/wisp/main/assets/wisp-logo.jpeg
description: >-
  Wisp is a high-performance Nostr relay written in Zig. Run your own private
  relay so your notes, reactions, and profile events are backed up under your
  control, and connect it to clients like Damus, Amethyst, or Gossip.


  Step 1. Install Wisp and wait for it to start.


  Step 2. Add your relay URL in your Nostr client:

  - On your home network or over Tailscale: ws://umbrel:7777 (connects directly
  to the relay, ideal for Cloudflare tunnels or other reverse proxies)

  - Over Tor: use the onion address shown on the Wisp app page (ws://<onion>)

  - Remotely without Tor: expose port 7777 through your router or VPN and use
  ws://<your-address>:7777


  Wisp stores events in LMDB on persistent app storage, supports negentropy
  reconciliation for fast relay-to-relay sync, includes an optional spider that
  pulls events from the people you follow on public relays, and exposes NIP-86
  management commands.


  Click the Wisp icon on your Umbrel dashboard to open its management page:
  view the relay's local and Tor websocket addresses, edit every wisp.toml
  setting in a form, save, restart the relay, and configure optional retention
  that purges events older than a chosen age. The management page is also
  served directly at http://umbrel:3000; the relay itself listens directly on
  port 7777. The config file can still be edited directly at Files -> Apps ->
  Wisp -> data -> wisp.toml.


  This package builds the upstream Wisp v0.9.3 release from source. It is
  repackaged from Start9-Community/wisp-startos for umbrelOS.
developer: privkeyio
