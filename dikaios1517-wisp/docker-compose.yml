version: "3.7"

services:
  app_proxy:
    environment:
      # Forwards the app's Umbrel page / Tor hidden service / LAN port to the
      # management GUI on port 3000. The GUI itself transparently proxies
      # websocket upgrades, NIP-11 info requests and /metrics to the relay on
      # 7777, so Nostr clients connect to the same exported address.
      APP_HOST: dikaios1517-wisp_wisp_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  wisp:
    # Image is built and pushed by the build-apps workflow to
    # ghcr.io/dikaios1517, tagged with the version in umbrel-app.yml.
    image: ghcr.io/dikaios1517/dikaios1517-wisp:0.9.5
    init: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    # The relay is published DIRECTLY on the host so LAN clients, Tailscale,
    # and tunnels (e.g. cloudflared) reach wisp itself, not the app proxy:
    #   ws://<umbrel-ip>:7777  -> relay (cloudflared tunnel target)
    #   http://<umbrel-ip>:3000 -> management GUI
    # The Umbrel dashboard icon and the Tor hidden service still route through
    # app_proxy to the GUI on 3000, which transparently proxies relay traffic.
    ports:
      - "7777:7777"
      - "3000:3000"
    environment:
      # umbreld injects the app's Tor hostname here (not-enabled.onion unless
      # remote Tor access is switched on); the GUI displays it.
      APP_HIDDEN_SERVICE: ${APP_HIDDEN_SERVICE:-not-enabled.onion}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/3000"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
