version: "3.7"

services:
  app_proxy:
    environment:
      # Forwards the app's Umbrel page / Tor hidden service / LAN port
      # to wisp's websocket. Umbrel's proxy passes websocket upgrades,
      # so Nostr clients reach the relay through the exported port.
      APP_HOST: dikaios1517-wisp_wisp_1
      APP_PORT: 7777
      PROXY_AUTH_ADD: "false"

  wisp:
    # Convention: ghcr.io/<your-github-user>/<app-id>:<version>. The
    # build-apps workflow pushes there automatically; replace
    # YOUR_GH_USERNAME with your GitHub account name before pushing.
    image: ghcr.io/dikaios1517/dikaios1517-wisp:0.9.3
    init: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/7777"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
