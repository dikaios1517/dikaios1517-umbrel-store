# Kirk: keep theme assets fresh. The custom theme file keeps the same name
# across Kirk releases (it embeds the upstream Jethro version), and the
# logo/favicons are likewise stable URLs whose CONTENT changes with each
# Kirk release — so browsers would otherwise keep serving stale cached
# copies after an app update. Images are few and tiny (logo, sprites,
# favicons), so revalidating them is cheap.
<FilesMatch "\.(css|png|ico)$">
    Header set Cache-Control "no-cache, must-revalidate"
</FilesMatch>
