version: "3.7"

services:
  app_proxy:
    environment:
      # Forwards the app's Umbrel page / Tor hidden service / LAN port to
      # Apache inside the web container. Kirk's UI owns the app_proxy slot;
      # no Docker ports: publish on this port.
      APP_HOST: dikaios1517-kirk_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    # Built and pushed by the build-apps workflow to ghcr.io/dikaios1517,
    # tagged with the version in umbrel-app.yml (keep the two in sync).
    image: ghcr.io/dikaios1517/dikaios1517-kirk:2.39.0-24
    init: true
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Rendered into conf.php on first start by the entrypoint.
      # Container NAME (not service name) - service-name DNS does not
      # resolve because umbreld forces <app>_<service>_1 container names.
      KIRK_DB_HOST: dikaios1517-kirk_db_1
      KIRK_DB_NAME: kirk
      KIRK_DB_USER: kirk
      # Container-internal only; change it in the app's data/conf.php if you
      # ever move the database off this app.
      KIRK_DB_PASSWORD: kirk-umbrel-internal
    volumes:
      # Persistent state lives under APP_DATA_DIR/data so umbrelOS's Files
      # manager and movable data root manage it like every other app.
      - ${APP_DATA_DIR}/data:/data
      # Uploads bound straight into the web root (no symlinks).
      - ${APP_DATA_DIR}/data/files:/var/www/html/files
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    image: mariadb:11.4
    init: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/mysql:/var/lib/mysql
    environment:
      MARIADB_DATABASE: kirk
      MARIADB_USER: kirk
      MARIADB_PASSWORD: kirk-umbrel-internal
      MARIADB_ROOT_PASSWORD: kirk-umbrel-root
      MARIADB_AUTO_UPGRADE: "true"
      MARIADB_DISABLE_LOG_BIN: "1"
    # Jethro's requirements (upstream README): utf8mb4/utf8mb4_unicode_ci,
    # ONLY_FULL_GROUP_BY disabled, log_bin_trust_function_creators enabled.
    # MariaDB is only reachable inside this app's compose network.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --log-bin-trust-function-creators=1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
