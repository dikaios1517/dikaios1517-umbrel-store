releaseNotes: >-
  2.39.0-11: revert of 2.39.0-10's self-sizing bar (it collapsed the header
  layout); the 44px band is back with the menu row sized to fit inside it.
  2.39.0-12: two-row header restored (logo/title and user dropdown back above
  the menu, global search field beside the user button); menu hover/open text
  now light instead of dark; dropdown and user-panel links light instead of
  yellow; user panel, table headers and remaining lavender/cream surfaces now
  dark; icon glyphs tinted teal so search/user icons are visible.
  2.39.0-13: dropdown hover no longer paints the heading lavender with dark
  text; sub-item hover is teal with dark text; phone-number context menu yellow
  links now light; all in-content links (View/Edit/Add Note, phone numbers) teal;
  mobile hamburger menu bars dark instead of lavender; browser tab shows the
  Kirk icon and "Kirk" as the title.
  2.39.0-14: global search field and account button share one centerline; a
  real favicon <link> (cache-proof) serves the Kirk icon in the browser tab;
  the mobile logo stays pinned when the search field is focused.
  2.39.0-15: the search field and account button move back to the right side
  of the header (flex auto-margin).
  2.39.0-16: flex auto-margin on the pair's first item — the search field was
  collapsing at the left edge under the title.
  2.39.0-17: header row right-packs with justify-content (no auto-margins), so
  the account button sits top-right even on the home page where the search
  field does not exist.
  2.39.0-18: attendance/roster keyboard cursor row is now a dark surface with
  a teal outline (was light green, washing out the name).
  2.39.0-19: statistics summary row ("Whole System") and all Bootstrap table
  row-state colors (info/success/error/warning/active + row hover) are dark
  surfaces with light text instead of light-theme pastels. 2.39.0-9: responsive header - the single-row header now applies only to
  wide screens; narrow windows get a stacked header with the hamburger menu
  working and the logo contained in the bar. 2.39.0-8: logo/title and user button edge-aligned with the content panels
  below. 2.39.0-7: header positioning fix - logo/title and user button were anchored
  to the page instead of the header bar; now vertically centered in the bar
  and edge-aligned with the menu band, teal user icon, visible search icon. 2.39.0-5: no-cache headers for stylesheets so theme updates render without
  a hard browser refresh. 2.39.0-4: single-row header - logo and app name sit left of the menu, the
  user dropdown right of it; larger logo icon; the menu band is dark instead
  of gray, with teal dropdown carets and dark hover states. 2.39.0-3: dark top bar (title strip no longer light gray), larger bold app
  title, and the Kirk Celtic-cross icon shown as a logo beside the title.
  2.39.0-2: theme fix - Jethro loads the custom stylesheet INSTEAD of its
  packaged CSS (if/elseif in the head template), so the first release rendered
  a raw unstyled menu. The custom file is now a complete stylesheet (upstream
  compiled CSS + the dark/teal overrides appended). 2.39.0-1: initial release
  - Jethro PMM 2.39.0 with a dark interface (light teal-blue accents), a
  Celtic cross icon, and a bundled MariaDB with Jethro's required database
  settings.
