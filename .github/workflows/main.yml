# Generic multi-app build: discovers every top-level folder containing an
# umbrel-app.yml and builds/pushes a GHCR image for each. On a push, only
# apps whose folder changed are rebuilt; a manual dispatch builds all apps.
#
# Conventions each app folder must follow:
#   - folder name == app id (e.g. dikaios1517-wisp), prefixed with the store id
#   - umbrel-app.yml with a quoted version: "1.2.3"
#   - a Dockerfile
# The image lands at ghcr.io/<repo-owner>/<app-id>:<version>, which is what
# the app's docker-compose.yml should reference.

name: Build app images

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read
  packages: write

concurrency:
  group: app-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: apps
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED="$(ls -d */ | tr -d '/' || true)"
          else
            CHANGED="$(git diff --name-only HEAD~1 HEAD | cut -d/ -f1 | sort -u || true)"
          fi
          APPS="["
          first=1
          for d in $CHANGED; do
            # Only folders that are a real app (umbrel-app.yml) and have
            # their own Dockerfile need building; prebuilt-image apps skip.
            [ -f "$d/umbrel-app.yml" ] || continue
            [ -f "$d/Dockerfile" ] || continue
            [ $first -eq 1 ] || APPS="$APPS,"
            APPS="$APPS\"$d\""
            first=0
          done
          APPS="$APPS]"
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          echo "Detected apps: $APPS"

  build:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          set -e
          VERSION="$(grep -E '^version:' '${{ matrix.app }}/umbrel-app.yml' \
            | head -1 | awk '{print $2}' | tr -d '\"')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.app }} version $VERSION"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compiled-language arm64 builds run under QEMU and can take 20-40 min
      # the first time; the GHA cache keeps later rebuilds much faster.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
