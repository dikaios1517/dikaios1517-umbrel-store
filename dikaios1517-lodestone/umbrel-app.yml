releaseNotes: >-
  0.1.4: startup order per spec — on every restart the relay builds the social
  graph only if it is missing or older than the refresh window (24 h); with a
  fresh graph it proceeds straight to note aggregation. The "Last graph crawl"
  stat now records real crawl completions. Also in 0.1.2: save toasts, "Restart relay" button, visible toggle
  switches. First release: social-graph inbox relay with automatic per-author
  relay discovery, five-minute aggregation sweeps, stranger proof-of-work
  gating, calendar-month retention with owner exemption, and a slate/orange
  management GUI with a feed, live settings, and moderation tools.
