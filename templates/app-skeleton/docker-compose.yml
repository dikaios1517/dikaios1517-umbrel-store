version: "3.7"

services:
  app_proxy:
    environment:
      # Required. Routes the app's Umbrel page, Tor hidden service, and LAN
      # port to your app's service. Format: <app-id>_<service-name>_1
      APP_HOST: dikaios1517-<name>_<service>_1
      APP_PORT: <PORT>
      PROXY_AUTH_ADD: "false"

  <service>:
    # Convention: ghcr.io/<your-github-user>/<app-id>:<version>. The
    # build-apps workflow pushes there automatically (only for folders with
    # a Dockerfile). Replace YOUR_GH_USERNAME before pushing.
    image: ghcr.io/YOUR_GH_USERNAME/dikaios1517-<name>:<version>
    init: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
